<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand" aria-label="Bootshift home">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" />
        <path d="M7 15.5 12 10.5l5 5M7 10 12 5l5 5" />
      </svg>
      <span>Bootshift</span>
    </a>

    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Runs</a>
    </nav>

    <div class="spacer"></div>

    <span class="version mono" title="Migration target">3.5 → 4.1</span>

    <button type="button" class="icon" (click)="theme.cycle()" [attr.aria-label]="themeLabel()" [title]="themeLabel()">
      @switch (theme.choice()) {
        @case ('light') {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        }
        @case ('dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
        }
      }
    </button>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer>
  <span>Recipes first, AI second, verification always.</span>
  <span class="muted">Phase 1 · simulated pipeline</span>
</footer>
