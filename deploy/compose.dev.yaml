# Local development services. The backend and frontend run on the host (see docs/development.md).
#
#   docker compose -f deploy/compose.dev.yaml up -d                          # Postgres and the Maven proxy
#   docker compose -f deploy/compose.dev.yaml up -d reposilite               # Only the Maven proxy (real pipeline)
#   docker compose -f deploy/compose.dev.yaml --profile observability up -d  # + Grafana LGTM
#
# Credentials here are local-only defaults and match backend/src/main/resources/application.yaml.
name: bootshift-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bootshift
      POSTGRES_USER: bootshift
      POSTGRES_PASSWORD: bootshift
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootshift -d bootshift"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces, metrics and logs in one container: Grafana on :3000, OTLP on :4317/:4318.
  # Point the backend at it with:
  #   MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://localhost:4318/v1/traces
  #   BOOTSHIFT_OTEL_METRICS_ENABLED=true
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  # Dependency proxy for sandbox builds (README section 13). Builds run on the internal
  # "bootshift-sandbox" network, which has no route out; Reposilite is the only service on it that
  # can also reach the internet, and it only proxies Maven Central.
  reposilite:
    image: dzikoysk/reposilite:3.6.6
    environment:
      REPOSILITE_OPTS: "--shared-configuration=/etc/reposilite/configuration.shared.json --no-color"
      JAVA_OPTS: "-Xmx256m"
    volumes:
      - ./reposilite/configuration.shared.json:/etc/reposilite/configuration.shared.json:ro
      - reposilite-data:/app/data
    networks:
      - sandbox
      - egress

networks:
  # Internal: containers on it reach each other but nothing else. Bootshift refuses to build otherwise.
  sandbox:
    name: bootshift-sandbox
    internal: true
  egress:
    name: bootshift-egress

volumes:
  postgres-data:
  reposilite-data:
