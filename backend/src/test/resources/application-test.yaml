# Integration tests use a Testcontainers Postgres (see TestDatabase). To run them against an
# existing database instead (e.g. without Docker), set BOOTSHIFT_TEST_DB_URL, _USER and _PASSWORD.
spring:
  datasource:
    url: ${BOOTSHIFT_TEST_DB_URL:jdbc:postgresql://localhost:5432/bootshift}
    username: ${BOOTSHIFT_TEST_DB_USER:bootshift}
    password: ${BOOTSHIFT_TEST_DB_PASSWORD:bootshift}

bootshift:
  github:
    # Never read a GitHub App saved on the developer's machine.
    app-id:
    app-slug:
    private-key-path:
    config-dir: ${java.io.tmpdir}/bootshift-test-home-${random.uuid}
  runs:
    poll-interval: 50ms
  pipeline:
    fake-step-delay: 0ms
