spring:
  application:
    name: bootshift
  threads:
    virtual:
      enabled: true
  datasource:
    # Defaults match deploy/compose.dev.yaml. Production installs set all three (README section 18).
    url: ${BOOTSHIFT_DB_URL:jdbc:postgresql://localhost:5432/bootshift}
    username: ${BOOTSHIFT_DB_USER:bootshift}
    password: ${BOOTSHIFT_DB_PASSWORD:bootshift}
  mvc:
    problemdetails:
      enabled: true

server:
  # There is no login until Phase 6, so only listen on localhost by default.
  address: ${BOOTSHIFT_BIND_ADDRESS:127.0.0.1}
  port: ${BOOTSHIFT_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # OTLP export is off by default. To send traces and metrics to Grafana LGTM, set
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT and BOOTSHIFT_OTEL_METRICS_ENABLED=true.
  otlp:
    metrics:
      export:
        enabled: ${BOOTSHIFT_OTEL_METRICS_ENABLED:false}
        url: ${BOOTSHIFT_OTEL_METRICS_URL:http://localhost:4318/v1/metrics}

bootshift:
  runs:
    max-concurrent: 2
    poll-interval: 500ms
    worker-enabled: true
  pipeline:
    # Phase 1 only has the fake pipeline. It moves a run through every stage without touching Git, Docker or a model.
    mode: fake
    fake-step-delay: 800ms
