spring:
  application:
    name: bootshift
  threads:
    virtual:
      enabled: true
  datasource:
    # Defaults match deploy/compose.dev.yaml. Production installs set all three (README section 18).
    url: ${BOOTSHIFT_DB_URL:jdbc:postgresql://localhost:5432/bootshift}
    username: ${BOOTSHIFT_DB_USER:bootshift}
    password: ${BOOTSHIFT_DB_PASSWORD:bootshift}
  mvc:
    problemdetails:
      enabled: true

server:
  # There is no login until Phase 6, so only listen on localhost by default.
  address: ${BOOTSHIFT_BIND_ADDRESS:127.0.0.1}
  port: ${BOOTSHIFT_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # OTLP export is off by default. To send traces and metrics to Grafana LGTM, set
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT and BOOTSHIFT_OTEL_METRICS_ENABLED=true.
  otlp:
    metrics:
      export:
        enabled: ${BOOTSHIFT_OTEL_METRICS_ENABLED:false}
        url: ${BOOTSHIFT_OTEL_METRICS_URL:http://localhost:4318/v1/metrics}

bootshift:
  github:
    # Your own GitHub App (docs/github-app.md). Once these are set, runs are limited to allowlisted repositories.
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
  runs:
    max-concurrent: 2
    poll-interval: 500ms
    worker-enabled: true
  pipeline:
    # fake: every stage is simulated; needs no Docker or GitHub (the default).
    # real: clones and runs the baseline build in the sandbox; later stages are simulated until Phases 3 to 5.
    mode: ${BOOTSHIFT_PIPELINE_MODE:fake}
    fake-step-delay: 800ms
  workspace:
    # Working copies (deleted when a run ends) and build logs. Keep it out of synced folders such as OneDrive.
    root: ${BOOTSHIFT_WORKSPACE:${java.io.tmpdir}/bootshift}
  sandbox:
    # Build it with: docker build -t bootshift-sandbox:dev sandbox
    image: ${BOOTSHIFT_SANDBOX_IMAGE:bootshift-sandbox:dev}
    # Internal network from deploy/compose.dev.yaml; Bootshift refuses to build on a network with internet access.
    network: bootshift-sandbox
    maven-mirror: http://reposilite:8080/releases
    memory: 4GB
    cpus: 2
    pids-limit: 512
    build-timeout: 20m
